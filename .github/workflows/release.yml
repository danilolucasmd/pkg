name: Release

# Publishes the prebuilt binaries that install.sh downloads.
# Triggered by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # A job that never gets a runner is cancelled by GitHub after 24 hours, and
    # a cancelled matrix leg skips `release` below -- which is how v0.1.0 and
    # v0.1.1 were tagged without ever publishing anything. Fail in minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Both macOS targets build on the Apple-silicon runner: the Intel
          # image (macos-13) has been retired, so asking for it queues forever.
          # Xcode ships both SDKs, so the x86_64 leg is a plain cross-build with
          # no extra toolchain to configure.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # --target on every leg, including the native ones, so the binary is
      # always at the same path below.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: tar -czf pkg-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release pkg

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: pkg-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: pkg-*.tar.gz
          generate_release_notes: true
