[package]
name = "pkg"
version = "0.2.0"
edition = "2021"
description = "One set of verbs for every Linux package manager"
license = "MIT"
repository = "https://github.com/danilolucasmd/pkg"

[[bin]]
name = "pkg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
lto = true
strip = true
